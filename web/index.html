<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BitBalance — финансовый пульт">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BitBalance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BitBalance</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Как в HTML-версии: только внутренний скролл Flutter, без скролла страницы. */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      background: #f6f8fb;
    }
    body { touch-action: pan-y; overscroll-behavior-y: contain; }
    flt-glass-pane { overscroll-behavior: none; touch-action: pan-y; }
    @media (prefers-color-scheme: dark) { html, body { background: #0f172a; } }
  </style>

  <!-- Telegram Mini App: тот же API, что использовала HTML-версия. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        try {
          tg.ready();
          tg.expand();
          // Иначе Telegram тянет весь Mini App вниз вместо скролла其内容.
          if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
          if (typeof tg.setAllowClosing === 'function') tg.setAllowClosing(false);
        } catch (e) {}
        if (tg.themeParams && tg.themeParams.bg_color) {
          document.body.style.background = tg.themeParams.bg_color;
        }
      }
      window.__bbTgInfo = function () {
        if (!tg) return '';
        return JSON.stringify({
          initData: tg.initData || '',
          user: (tg.initDataUnsafe && tg.initDataUnsafe.user) || null,
          platform: tg.platform || ''
        });
      };

      // Web Push — тот же сценарий, что был в HTML-версии.
      window.__bbPushSubscribe = function () {
        return (async function () {
          if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
            return 'Push не поддерживается этим браузером';
          }
          try {
            if (!navigator.serviceWorker.controller) {
              await navigator.serviceWorker.register('/sw.js');
            }
            const reg = await navigator.serviceWorker.ready;
            const r = await fetch('/api/push/vapid-public');
            const d = await r.json();
            if (!d.publicKey) return 'VAPID-ключ не настроен на сервере';
            const padding = '='.repeat((4 - d.publicKey.length % 4) % 4);
            const raw = atob((d.publicKey + padding).replace(/-/g, '+').replace(/_/g, '/'));
            const key = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; ++i) key[i] = raw.charCodeAt(i);
            const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
            const resp = await fetch('/api/push/subscribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify(sub.toJSON())
            });
            if (!resp.ok) return 'Не удалось сохранить подписку';
            return '';
          } catch (e) {
            return String(e && e.message ? e.message : e);
          }
        })();
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
